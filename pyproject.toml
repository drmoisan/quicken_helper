[project]
name = "quicken-helper"
version = "0.1.0"
requires-python = ">=3.13"
# … your runtime dependencies …

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
coverage = "^7.0"
# … all your test + dev-only dependencies …
pre-commit = "^4.3.0"
pandas-stubs = "^2.3.2.250827"
viztracer = "^1.0.4"
pytest-cov = "^7.0.0"

[tool.poetry.group.lint.dependencies]
black = "25.1.0"
ruff = "0.12.12"


[tool.poetry.dependencies]
pandas = "^2.3.2"
pyparsing = "^3.1.2"
[tool.black]
line-length = 88
target-version = ["py313"]
skip-string-normalization = false

[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "S101",  # assert-used (allowed in tests)
    "S110",  # try-except-pass (acceptable for non-critical operations)
    "S112",  # try-except-continue (acceptable for robust error handling)
    "TID252", # prefer-absolute-imports (relative imports acceptable within packages)
    "TC001", # typing-only-first-party-import (deferred; requires runtime refactor)
    "TC003", # typing-only-standard-library-import (deferred; requires runtime refactor)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert statements are expected in tests
]
"tests/utilities/test_convert_value.py" = [
    "UP007",  # Tests for Union syntax conversion
    "UP045",  # Tests for Optional syntax conversion
]
"quicken_helper/gui_viewers/probe_tab.py" = [
    "S603",  # subprocess-without-shell-equals-true (intentional for opening folders)
    "S606",  # start-process-with-no-shell (intentional for opening folders)
    "S607",  # start-process-with-partial-path (intentional for opening folders)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["quicken_helper"]
force-single-line = false

[tool.pyright]
typeCheckingMode = "strict"
diagnosticMode = "workspace"
reportMissingTypeArgument = "none"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
exclude = [
  "**/__pycache__",
  ".idea",
  ".ruff_cache",
  ".venv",
  "build",
  "dist"
]
